services:
  postgres:
    image: postgres:16-alpine
    container_name: rescuefood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rescuefood
    ports:
      - "5432:5432"
    volumes:
      - rescuefood-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rescuefood"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rescuefood-postgres-data:
